<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FWE 英検4級 文法ゲームの目次">
  <title>FWE 英検4級 文法ゲーム</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23073b4c'/%3E%3Cpath d='M18 17h31v9H28v8h17v9H28v15H18z' fill='%23ffd166'/%3E%3C/svg%3E">
  <style>
    :root {
      --navy: #073b4c;
      --blue: #087e8b;
      --blue-dark: #056873;
      --cyan: #dff8fb;
      --yellow: #ffd166;
      --ink: #18323a;
      --muted: #5c7077;
      --white: #ffffff;
      --line: #c9e1e5;
      --shadow: 0 18px 45px rgba(7, 59, 76, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 6% 7%, rgba(255, 209, 102, .48) 0 7rem, transparent 7.1rem),
        radial-gradient(circle at 95% 86%, rgba(8, 126, 139, .18) 0 11rem, transparent 11.1rem),
        linear-gradient(145deg, #f5fdff 0%, #e9f8fb 58%, #fff9e9 100%);
    }

    a { color: inherit; }

    .shell {
      width: min(960px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 54px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 28px;
      color: var(--navy);
      font-weight: 900;
    }

    .brand-badge {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      border-radius: 15px 6px 15px 6px;
      background: var(--yellow);
      box-shadow: 4px 5px 0 var(--navy);
      font-size: 1.2rem;
    }

    .brand-name { font-size: clamp(1.08rem, 3vw, 1.45rem); }

    .intro {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 24px;
      margin-bottom: 22px;
      padding: clamp(24px, 5vw, 42px);
      border: 2px solid rgba(7, 59, 76, .1);
      border-radius: 28px;
      background: rgba(255, 255, 255, .95);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      display: inline-block;
      margin: 0 0 9px;
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--navy);
      background: var(--cyan);
      font-size: .86rem;
      font-weight: 900;
      letter-spacing: .08em;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 12px;
      color: var(--navy);
      font-size: clamp(2rem, 6vw, 3.3rem);
      line-height: 1.18;
    }

    .intro p {
      max-width: 600px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 1.03rem;
      line-height: 1.75;
    }

    .book-mark {
      display: grid;
      place-items: center;
      width: 112px;
      height: 112px;
      border-radius: 32px 12px 32px 12px;
      color: var(--yellow);
      background: var(--navy);
      box-shadow: 8px 9px 0 var(--yellow);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      transform: rotate(2deg);
    }

    .list-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 32px 4px 14px;
    }

    .list-head h2 {
      margin-bottom: 0;
      color: var(--navy);
      font-size: clamp(1.35rem, 4vw, 1.8rem);
    }

    .count {
      color: var(--blue-dark);
      font-size: .92rem;
      font-weight: 900;
    }

    .game-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .game-card {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 18px;
      min-height: 154px;
      padding: 22px;
      overflow: hidden;
      border: 3px solid transparent;
      border-radius: 23px;
      background: var(--white);
      box-shadow: 0 12px 30px rgba(7, 59, 76, .11);
      text-decoration: none;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .game-card::after {
      content: "";
      position: absolute;
      right: -35px;
      bottom: -50px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(8, 126, 139, .08);
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: var(--yellow);
      box-shadow: 0 18px 38px rgba(7, 59, 76, .17);
    }

    .game-card:focus-visible {
      outline: 4px solid rgba(255, 209, 102, .9);
      outline-offset: 4px;
    }

    .game-icon {
      display: grid;
      place-items: center;
      width: 70px;
      height: 70px;
      border-radius: 19px;
      color: var(--white);
      background: linear-gradient(145deg, var(--blue), var(--navy));
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1.05rem;
      font-weight: 900;
      line-height: 1.15;
      text-align: center;
    }

    .game-number {
      margin-bottom: 4px;
      color: var(--blue);
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .game-card h3 {
      margin-bottom: 8px;
      color: var(--navy);
      font-size: clamp(1.03rem, 3vw, 1.24rem);
      line-height: 1.45;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      padding: 4px 8px;
      border-radius: 999px;
      color: #31545d;
      background: #edf7f8;
      font-size: .76rem;
      font-weight: 800;
    }

    .arrow {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      color: var(--navy);
      background: var(--yellow);
      font-size: 1.35rem;
      font-weight: 900;
    }

    .coming-soon {
      display: grid;
      place-items: center;
      min-height: 154px;
      padding: 24px;
      border: 3px dashed var(--line);
      border-radius: 23px;
      color: var(--muted);
      background: rgba(255, 255, 255, .52);
      text-align: center;
      line-height: 1.65;
    }

    .coming-soon strong {
      display: block;
      margin-bottom: 5px;
      color: var(--navy);
      font-size: 1.05rem;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: .87rem;
      text-align: center;
    }

    @media (max-width: 720px) {
      .shell { width: min(100% - 18px, 960px); padding-top: 16px; }
      .intro { grid-template-columns: 1fr; border-radius: 22px; }
      .book-mark { display: none; }
      .game-list { grid-template-columns: 1fr; }
      .game-card { min-height: 140px; padding: 18px; gap: 13px; }
      .game-icon { width: 60px; height: 60px; border-radius: 16px; font-size: .92rem; }
    }

    @media (max-width: 430px) {
      .game-card { grid-template-columns: auto 1fr; }
      .arrow { display: none; }
      .list-head { align-items: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand">
      <span class="brand-badge" aria-hidden="true">FWE</span>
      <span class="brand-name">English Learning Games</span>
    </header>

    <section class="intro" aria-labelledby="pageTitle">
      <div>
        <p class="eyebrow">EIKEN GRADE 4</p>
        <h1 id="pageTitle">英検4級<br>文法ゲーム</h1>
        <p>練習したい文法を選びましょう。問題を解いて、解説を読み、英文を声に出して確認できます。</p>
      </div>
      <div class="book-mark" aria-hidden="true">4th</div>
    </section>

    <div class="list-head">
      <h2>文法ゲーム一覧</h2>
      <span class="count">1 GAME</span>
    </div>

    <section class="game-list" aria-label="英検4級の文法ゲーム">
      <a class="game-card" href="Grade4_Quantifiers_There_is_are.html">
        <div class="game-icon" aria-hidden="true">a few<br>a little</div>
        <div>
          <div class="game-number">GRAMMAR 01</div>
          <h3>数量表現 ＆ There is / There are</h3>
          <div class="tags" aria-label="ゲームの機能">
            <span class="tag">全30問</span>
            <span class="tag">解説つき</span>
            <span class="tag">音読</span>
          </div>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <div class="coming-soon">
        <div><strong>More games coming soon!</strong>新しい文法ゲームをここに追加していきます。</div>
      </div>
    </section>

    <footer>FWE · EIKEN Grade 4 Grammar</footer>
  </main>
</body>
</html>
