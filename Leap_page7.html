  <section id="dialogue"></section>
  <p class="tip">💡 英文そのものをクリックしても音声が流れます。</p>
</main>
<script>
const lines=[
 {s:'Noah',e:'Ellie, what do you have in your backpack?',j:'エリー、リュックの中に何を持っているの？'},
 {s:'Ellie',e:'I have a few pencils, a few sheets of paper, a few textbooks, and a wallet. How about you, Noah?',j:'鉛筆を数本、紙を数枚、教科書を数冊、それから財布を持っているよ。ノアは？'},
 {s:'Noah',e:'I have a lot of pencils, a notebook, a bottle of water, and a soccer ball.',j:'僕はたくさんの鉛筆、ノート1冊、水のボトル1本、それからサッカーボールを持っているよ。'},
 {s:'Noah',e:'Oh, no! I forgot to bring lunch money! Can I borrow some money?',j:'しまった！昼食代を持ってくるのを忘れた！少しお金を借りてもいい？'},
 {s:'Ellie',e:'Sorry, I only have little money in my wallet. I have an idea. Why don’t you ask Mr. Potato?',j:'ごめんね。財布にはほとんどお金がないの。いい考えがあるよ。ミスター・ポテトに聞いてみたら？'}
];
const box=document.getElementById('dialogue');
box.innerHTML=lines.map((x,i)=>`<article class="card ${x.s.toLowerCase()}" id="card${i}"><div class="speaker">${x.s}</div><p class="english" onclick="speak(${i},1)">${x.e}</p><div class="actions"><button onclick="speak(${i},1)">🔊 音読</button><button class="slow" onclick="speak(${i},.72)">🐢 ゆっくり</button><button class="jpbtn" onclick="toggleJP(${i},this)">🇯🇵 日本語訳</button></div><div class="jp" id="jp${i}">${x.j}</div></article>`).join('');
let voices=[];let runId=0;
function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));const sel=document.getElementById('voice');const current=sel.value;sel.innerHTML='<option value="">英語の声：自動</option>'+voices.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('');sel.value=current}
speechSynthesis.onvoiceschanged=loadVoices;loadVoices();
function utter(text,rate,onend){const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;const n=document.getElementById('voice').value;if(n!==''&&voices[+n])u.voice=voices[+n];u.onend=onend||null;u.onerror=onend||null;speechSynthesis.speak(u)}
function clearPlaying(){document.querySelectorAll('.playing').forEach(x=>x.classList.remove('playing'))}
function speak(i,rate){stopSpeech();document.getElementById('card'+i).classList.add('playing');utter(lines[i].e,rate,clearPlaying)}
function playAll(){stopSpeech();const id=++runId;let i=0;function next(){clearPlaying();if(id!==runId||i>=lines.length)return;document.getElementById('card'+i).classList.add('playing');utter(lines[i++].e,.9,next)}next()}
function stopSpeech(){runId++;speechSynthesis.cancel();clearPlaying()}
function toggleJP(i,b){const el=document.getElementById('jp'+i);el.classList.toggle('show');b.textContent=el.classList.contains('show')?'🇯🇵 訳を隠す':'🇯🇵 日本語訳'}
</script>
